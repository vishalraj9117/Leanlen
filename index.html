    <script>
      // Gracefully prevent unhandled promise rejection errors from HMR websocket disconnects in iframe/container previews
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason ? (typeof reason === 'string' ? reason : (reason.message || '')) : '';
        if (msg.indexOf('WebSocket') !== -1 || (reason && reason.name === 'WebSocketError')) {
          event.preventDefault();
        }
      });
    </script>
